name: CDN

# Uploads `packages/emails/assets/` to the asset CDN: the `franciscosolis` R2 bucket, served at
# cdn.franciscosolis.cl, under the `emails/` prefix. That is where `theme.logo.src` in
# `packages/emails` points every email this monorepo sends.
#
# The bucket is shared with the front-end repository, which uploads its own `cdn/` directory to
# every other prefix. So this workflow writes under `emails/` and nowhere else, and it only ever
# puts: a sync that deleted whatever it did not know would erase the front-end's brand kit.
#
# Like migrate.yml, this races Cloudflare's deploy from the same push. A changed logo is harmless
# (the old copy answers until this finishes); a logo at a *new* key would be a broken image in every
# email sent in the meantime, and those stay sent — so upload a new key by hand (the dispatch below)
# before merging the change that points at it.

on:
  push:
    branches: [dev]
    paths:
      - 'packages/emails/assets/**'
      - '.github/workflows/cdn.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cdn
  cancel-in-progress: false

jobs:
  sync:
    name: sync emails/ on cdn.franciscosolis.cl
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      # First, before anything installs, so a missing secret reads as a missing secret rather than
      # as a Wrangler authentication error several minutes later.
      - name: Check credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set as repository secrets. The token needs Workers R2 Storage:Edit on this account."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # For Wrangler, at the version the catalog pins.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A week of Cache-Control and not `immutable`, for the reason `apps/api/src/brand.ts` gives:
      # the key is a stable name, so a corrected logo has to be able to replace the cached one.
      - name: Upload
        run: |
          set -euo pipefail
          echo '## CDN: emails/' >> "$GITHUB_STEP_SUMMARY"
          for file in packages/emails/assets/*; do
            name="$(basename "$file")"
            case "$name" in
              *.png) type=image/png ;;
              *.svg) type=image/svg+xml ;;
              *.webp) type=image/webp ;;
              *.jpg|*.jpeg) type=image/jpeg ;;
              *.gif) type=image/gif ;;
              *) echo "::error::$file: no content type for this extension — add it to cdn.yml"; exit 1 ;;
            esac
            pnpm --filter api exec wrangler r2 object put "franciscosolis/emails/$name" \
              --remote --file "$GITHUB_WORKSPACE/$file" \
              --content-type "$type" --cache-control 'public, max-age=604800'
            echo "- https://cdn.franciscosolis.cl/emails/$name" >> "$GITHUB_STEP_SUMMARY"
          done
